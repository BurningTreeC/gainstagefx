name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    # The default Windows shell does not do brace expansion.
    shell: bash

env:
  PACKAGE: gainstagefx
  PLUGIN: GainStageFx

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-dev \
            libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check packaging metadata and validation helpers
        run: python3 -m unittest discover -s packaging/macos -p test_packaging.py
      - run: cargo test --release
      # --workspace so the installer that ships to users is linted too.
      - run: cargo clippy --release --workspace --all-targets -- -D warnings
      - name: Third party notices are up to date
        run: |
          python3 tools/third-party-notices.py
          git diff --exit-code THIRD-PARTY-NOTICES.md

  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-22.04 }
          - { name: macos-universal, os: macos-15 }
          - { name: windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-dev \
            libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal macOS binary is lipo'd together from both slices, so
          # both have to be installed even though the runner is one of them.
          targets: ${{ startsWith(matrix.os, 'macos') && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Test the Windows window backend
        if: startsWith(matrix.os, 'windows')
        run: cargo test --manifest-path vendor/baseview/Cargo.toml --features opengl --lib -- --test-threads=1

      - name: Build the installer
        # A small dependency free program that copies the bundles into place,
        # shipped in the Windows archive as install.exe.
        if: startsWith(matrix.os, 'windows')
        run: cargo build --release -p installer

      - name: Build the plugin
        run: |
          if [[ '${{ matrix.name }}' == 'macos-universal' ]]; then
            # This repository's own products, including native NIH CLAP/VST3.
            # Shared Rust/CMake deployment policy lives in packaging/macos/plugins.json.
            test "$(uname -m)" = arm64
            # Validate AUv2 before any AUv3 app exists on this runner.
            # macOS can discover build-tree extensions before explicit installation.
            # Discard only this project's generated AU apps restored by rust-cache.
            rm -rf target/macos-au/auv3 dist/macos
            cargo xtask bundle-au --all --release --format auv2
          else
            cargo xtask bundle "$PACKAGE" --release
          fi

      - name: Validate self-contained AUv2 (no standalone CLAP installed)
        if: startsWith(matrix.os, 'macos')
        run: |
          python3 packaging/macos/au.py install --format auv2
          python3 packaging/macos/au.py validate
          python3 packaging/macos/au.py probe --format auv2

      - name: Complete the distribution with AUv3
        if: startsWith(matrix.os, 'macos')
        # Reuses the Rust/AUv2 build cache and stages the complete distribution.
        # AUv2 validation above cannot accidentally select the same-ID AUv3.
        run: cargo xtask bundle-au --all --release

      - name: Register and test ad-hoc AUv3 containing apps
        if: startsWith(matrix.os, 'macos')
        run: |
          python3 packaging/macos/au.py install --format auv3
          python3 packaging/macos/au.py register --allow-unregistered-auv3
          python3 packaging/macos/au.py probe --format auv3 --allow-unregistered-auv3

      - name: Retain completed AU products if a later build or validation fails
        if: failure() && startsWith(matrix.os, 'macos')
        run: |
          if [[ -d dist/macos ]]; then
            mkdir -p target/macos-au/logs
            tar -czf target/macos-au/logs/partial-products-UNVALIDATED.tar.gz -C dist macos
          fi

      - name: Upload exact macOS build and validation results
        if: always() && startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN }}-macos-au-diagnostics
          path: |
            target/macos-au/logs/
            target/macos-au/build-manifest.json
          if-no-files-found: warn

      - name: Stage the archive contents
        run: |
          staged="staged/$PLUGIN-${{ matrix.name }}"
          mkdir -p "$staged"
          # The standalone binary is a development aid, not something to ship.
          rm -rf "target/bundled/$PLUGIN"
          if [[ '${{ runner.os }}' == macOS ]]; then
            # Each repository stages only its own dist/macos products and licenses.
            for product in dist/macos/*/; do cp -R "$product"* "$staged/"; done
            cp docs/MACOS_AUDIO_UNITS.md "$staged/"
          else
            cp -R target/bundled/* "$staged/"
          fi
          # The GPL requires the licence to travel with the binaries, and the
          # permissive licences of the dependencies require their notices.
          cp LICENSE THIRD-PARTY-NOTICES.md "$staged/"
          cp ".github/readme-${{ runner.os }}.txt" "$staged/README.txt"
          case '${{ runner.os }}' in
            Linux)
              cp .github/install-Linux.sh "$staged/install.sh"
              chmod +x "$staged/install.sh"
              ;;
            macOS)
              cp .github/install-macOS.command "$staged/Install.command"
              chmod +x "$staged/Install.command"
              ;;
            Windows)
              cp target/release/install.exe "$staged/install.exe"
              ;;
          esac
          ls -la "$staged"

      - name: Preserve macOS executable modes and bundle symlinks
        if: startsWith(matrix.os, 'macos')
        run: tar -czf "staged/$PLUGIN-${{ matrix.name }}.tar.gz" -C staged "$PLUGIN-${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        if: startsWith(matrix.os, 'macos')
        with:
          name: ${{ env.PLUGIN }}-${{ matrix.name }}
          path: staged/${{ env.PLUGIN }}-${{ matrix.name }}.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: "!startsWith(matrix.os, 'macos')"
        with:
          name: ${{ env.PLUGIN }}-${{ matrix.name }}
          path: staged/${{ env.PLUGIN }}-${{ matrix.name }}
          if-no-files-found: error

  release:
    name: Release
    needs: [test, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            # Validation logs are artifacts for review, not distributable plugins.
            [[ "$name" == *-macos-au-diagnostics ]] && continue
            if [[ -f "$dir/$name.tar.gz" ]]; then
              tar -xzf "$dir/$name.tar.gz" -C "$dir"
              (cd "$dir/$name" && zip -qry "../../../release/$name-${GITHUB_REF_NAME}.zip" .)
              continue
            fi
            # Executability is not preserved through the artifact round trip.
            chmod +x "$dir/Install.command" "$dir/install.sh" 2>/dev/null || true
            (cd "$dir" && zip -qr "../../release/$name-${GITHUB_REF_NAME}.zip" .)
          done
          ls -la release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip \
            --title "$PLUGIN $GITHUB_REF_NAME" \
            --notes-file - <<'NOTES'
          Built from this tag by GitHub Actions.

          Download the archive for your platform and run the installer inside
          it: `install.sh` on Linux, `install.exe` on Windows,
          `Install.command` on macOS. `README.txt` covers installing by hand.
          Every archive also contains `LICENSE` and `THIRD-PARTY-NOTICES.md`.

          **macOS:** the plugins are ad-hoc signed but not notarized, so macOS
          quarantines them. `Install.command` in the archive puts them in place
          and clears the quarantine flag; `README.txt` has the manual commands
          if you would rather do it yourself.
          NOTES
