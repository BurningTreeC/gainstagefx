name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# If another commit is pushed to the same branch while CI is still running,
# stop wasting runner time compiling the obsolete commit.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # The default Windows shell does not do brace expansion.
    shell: bash

env:
  PACKAGE: gainstagefx
  PLUGIN: GainStageFx
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgl-dev \
            libjack-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-dri2-0-dev \
            libxcb-icccm4-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: test-ci
          cache-on-failure: true

      # Do not use the shipping release profile here.
      #
      # GainStageFx is now large enough that opt-level=3 + Thin LTO makes
      # LLVM spend an enormous amount of time optimizing the test binaries.
      #
      # The ci profile is still optimized, so DSP tests are representative,
      # but it deliberately disables LTO and uses more codegen units.
      - name: Run tests
        run: cargo test --profile ci --workspace

      # Clippy does not need release/LTO code generation. Running it without
      # --release avoids recompiling the entire DSP graph at maximum
      # optimization just to perform linting.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Third party notices are up to date
        run: |
          python3 tools/third-party-notices.py
          git diff --exit-code THIRD-PARTY-NOTICES.md

  package:
    name: Package (${{ matrix.name }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04

          - name: macos-universal
            os: macos-latest

          - name: windows
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgl-dev \
            libjack-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-dri2-0-dev \
            libxcb-icccm4-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # A universal macOS binary is lipo'd together from both slices, so
          # both targets have to be installed.
          targets: ${{ startsWith(matrix.os, 'macos') && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      # Each platform gets an independent cache. In particular, do not mix
      # native Linux objects with Windows or either macOS architecture.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: package-${{ matrix.name }}
          cache-on-failure: true

      - name: Test the Windows window backend
        if: startsWith(matrix.os, 'windows')
        run: |
          cargo test \
            --manifest-path vendor/baseview/Cargo.toml \
            --features opengl \
            --lib \
            -- --test-threads=1

      - name: Build the Windows installer
        if: startsWith(matrix.os, 'windows')
        run: cargo build --release -p installer

      # Actual binaries shipped to users still use the real release profile:
      #
      #   opt-level = 3
      #   lto = "thin"
      #
      # We only removed expensive release optimization from CI correctness
      # tests and Clippy, not from the plugin itself.
      - name: Build the plugin
        run: |
          if [[ '${{ matrix.name }}' == 'macos-universal' ]]; then
            export MACOSX_DEPLOYMENT_TARGET=10.13

            if [[ '${{ github.ref }}' == refs/tags/v* ]]; then
              cargo xtask bundle-universal "$PACKAGE" --profile release-lto
            else
              cargo xtask bundle-universal "$PACKAGE" --release
            fi
          else
            if [[ '${{ github.ref }}' == refs/tags/v* ]]; then
              cargo xtask bundle "$PACKAGE" --profile release-lto
            else
              cargo xtask bundle "$PACKAGE" --release
            fi
          fi

      - name: Stage the archive contents
        run: |
          staged="staged/$PLUGIN-${{ matrix.name }}"
          mkdir -p "$staged"

          # The standalone binary is a development aid and is not shipped.
          rm -rf "target/bundled/$PLUGIN"

          cp -R target/bundled/* "$staged/"

          # Ship licensing information with every binary package.
          cp LICENSE THIRD-PARTY-NOTICES.md "$staged/"
          cp ".github/readme-${{ runner.os }}.txt" "$staged/README.txt"

          case '${{ runner.os }}' in
            Linux)
              cp .github/install-Linux.sh "$staged/install.sh"
              chmod +x "$staged/install.sh"
              ;;

            macOS)
              cp .github/install-macOS.command "$staged/Install.command"
              chmod +x "$staged/Install.command"
              ;;

            Windows)
              cp target/release/install.exe "$staged/install.exe"
              ;;
          esac

          echo "Staged package:"
          ls -la "$staged"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN }}-${{ matrix.name }}
          path: staged/${{ env.PLUGIN }}-${{ matrix.name }}
          if-no-files-found: error

  release:
    name: Release

    # Never publish a release unless both correctness testing and every
    # platform package succeeded.
    needs:
      - test
      - package

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform
        run: |
          mkdir -p release

          for dir in artifacts/*/; do
            name="$(basename "$dir")"

            # Executability is not preserved through the GitHub Actions
            # artifact round trip.
            chmod +x \
              "$dir/Install.command" \
              "$dir/install.sh" \
              2>/dev/null || true

            (
              cd "$dir"
              zip -qr "../../release/$name-${GITHUB_REF_NAME}.zip" .
            )
          done

          echo "Release archives:"
          ls -lah release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip \
            --title "$PLUGIN $GITHUB_REF_NAME" \
            --notes-file - <<'NOTES'
          Built from this tag by GitHub Actions.

          Download the archive for your platform and run the installer inside
          it: `install.sh` on Linux, `install.exe` on Windows,
          `Install.command` on macOS. `README.txt` covers installing by hand.
          Every archive also contains `LICENSE` and `THIRD-PARTY-NOTICES.md`.

          **macOS:** the plugins are ad-hoc signed but not notarized, so macOS
          quarantines them. `Install.command` in the archive puts them in place
          and clears the quarantine flag; `README.txt` has the manual commands
          if you would rather do it yourself.
          NOTES
