name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# If another commit is pushed to the same branch while CI is still running,
# stop wasting runner time compiling the obsolete commit.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # The default Windows shell does not do brace expansion.
    shell: bash

env:
  PACKAGE: gainstagefx
  PLUGIN: GainStageFx
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            jq \
            shellcheck \
            libasound2-dev \
            libgl-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libxkbcommon-x11-dev \
            libjack-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-dri2-0-dev \
            libxcb-icccm4-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: test-ci
          cache-on-failure: true

      # Use the dedicated CI profile instead of the shipping release profile.
      #
      # The CI profile is optimized and inherits release semantics, but avoids
      # expensive LTO:
      #
      #   opt-level = 2
      #   lto = "off"
      #   codegen-units = 16
      #
      # This keeps DSP tests representative while substantially reducing LLVM
      # optimization time.
      #
      # Finish all test binaries so one failing regression does not hide later
      # failures.
      - name: Run tests
        run: cargo test --profile ci --workspace --no-fail-fast

      - name: Test the Linux installers
        run: |
          shellcheck install.sh .github/install-Linux.sh
          python3 tools/test_linux_install.py

      # Some timing/realtime test-support code intentionally requires
      # release-style compilation. The CI profile gives Clippy release-style
      # cfg/debug-assertion behavior without paying for Thin/Fat LTO.
      - name: Clippy
        run: cargo clippy --profile ci --workspace --all-targets -- -D warnings

      - name: Third party notices are up to date
        run: |
          python3 tools/third-party-notices.py
          git diff --exit-code THIRD-PARTY-NOTICES.md

  package:
    name: Package (${{ matrix.name }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04

          - name: macos-universal
            os: macos-latest

          - name: windows
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgl-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            libgl1-mesa-dri \
            mesa-utils \
            xvfb \
            libfontconfig1-dev \
            libxkbcommon-x11-dev \
            libjack-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-dri2-0-dev \
            libxcb-icccm4-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # A universal macOS binary is lipo'd together from both slices, so
          # both targets have to be installed.
          targets: ${{ startsWith(matrix.os, 'macos') && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      # Each platform gets an independent cache. Do not mix native Linux
      # objects with Windows or either macOS architecture.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: package-${{ matrix.name }}
          cache-on-failure: true

      - name: Test the Windows window backend
        if: startsWith(matrix.os, 'windows')
        run: |
          cargo test \
            --manifest-path vendor/baseview/Cargo.toml \
            --features opengl,tracing \
            --lib \
            -- --test-threads=1

      # The installer is a small separate program. It does not need the
      # expensive release-lto profile used for the DSP plugin.
      - name: Build the Windows installer
        if: startsWith(matrix.os, 'windows')
        run: cargo build --release -p installer

      # Ordinary branch/PR package builds use the normal release profile:
      #
      #   opt-level = 3
      #   lto = "thin"
      #   codegen-units = 16
      #
      # Tagged releases use release-lto:
      #
      #   opt-level = 3
      #   lto = "fat"
      #   codegen-units = 1
      #
      # On macOS, nice-plug first creates universal CLAP/VST3 bundles from the
      # x86_64 and arm64 slices. The same universal Mach-O also contains the
      # AUv2 entry points exported by nice-plug-au2. tools/package_au2.sh wraps
      # that binary in a proper Audio Unit .component bundle and ad-hoc signs it.
      - name: Build the plugin
        run: |
          if [[ '${{ matrix.name }}' == 'macos-universal' ]]; then
            export MACOSX_DEPLOYMENT_TARGET=10.13

            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "Building tagged macOS universal release with release-lto profile"
              cargo xtask bundle-universal "$PACKAGE" --profile release-lto
            else
              echo "Building macOS universal CI package with release profile"
              cargo xtask bundle-universal "$PACKAGE" --release
            fi

            echo
            echo "Creating AUv2 component..."
            bash tools/package_au2.sh "$PLUGIN"
          else
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "Building tagged release with release-lto profile"
              cargo xtask bundle "$PACKAGE" --profile release-lto
            else
              echo "Building CI package with release profile"
              cargo xtask bundle "$PACKAGE" --release
            fi
          fi

      # Do not merely check that a .component directory exists. Verify that it
      # contains a valid bundle structure, the expected universal executable,
      # the AU factory/registration symbols, valid plist metadata, and a valid
      # ad-hoc code signature.
      - name: Verify the macOS AUv2 component
        if: startsWith(matrix.os, 'macos')
        run: |
          set -euo pipefail

          component="target/bundled/$PLUGIN.component"
          plist="$component/Contents/Info.plist"
          binary="$component/Contents/MacOS/$PLUGIN"

          echo "Verifying AUv2 bundle structure..."

          test -d "$component"
          test -d "$component/Contents"
          test -d "$component/Contents/MacOS"
          test -d "$component/Contents/Resources"
          test -f "$plist"
          test -f "$binary"
          test -x "$binary"

          echo
          echo "Validating Info.plist..."
          plutil -lint "$plist"

          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          package_type="$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$plist")"
          au_type="$(/usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:type' "$plist")"
          au_subtype="$(/usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:subtype' "$plist")"
          au_manufacturer="$(/usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:manufacturer' "$plist")"
          au_factory="$(/usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:factoryFunction' "$plist")"

          [[ "$executable" == "$PLUGIN" ]]
          [[ "$identifier" == "com.burningtreec.gainstagefx.au" ]]
          [[ "$package_type" == "BNDL" ]]
          [[ "$au_type" == "aufx" ]]
          [[ "$au_subtype" == "GSfx" ]]
          [[ "$au_manufacturer" == "BrTC" ]]
          [[ "$au_factory" == "NiceAu2Factory" ]]

          echo
          echo "AUv2 metadata:"
          echo "  executable   = $executable"
          echo "  identifier   = $identifier"
          echo "  type         = $au_type"
          echo "  subtype      = $au_subtype"
          echo "  manufacturer = $au_manufacturer"
          echo "  factory      = $au_factory"

          echo
          echo "Verifying universal architectures..."
          archs="$(lipo -archs "$binary")"
          echo "  $archs"

          [[ "$archs" == *"x86_64"* ]]
          [[ "$archs" == *"arm64"* ]]

          echo
          echo "Verifying AUv2 factory symbol..."
          nm -gU "$binary" | grep -E '(_)?NiceAu2Factory$'

          echo
          echo "Verifying AUv2 registration entry point..."
          nm -gU "$binary" | grep -E '(_)?nice_au2_register_plugin_entry$'

          echo
          echo "Verifying AUv2 metadata entry point..."
          nm -gU "$binary" | grep -E '(_)?nice_au2_metadata$'

          echo
          echo "Verifying Objective-C Cocoa view factory..."
          if command -v strings >/dev/null 2>&1; then
            strings "$binary" | grep 'NiceAu2CocoaViewFactory'
          fi

          echo
          echo "Verifying ad-hoc code signature..."
          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$component"

          echo
          echo "Code signature details:"
          codesign -dvv "$component" 2>&1 || true

          echo
          echo "AUv2 component verification passed."

      # Ask macOS's own Audio Unit validator to discover and validate the
      # component. Install it temporarily into the current runner user's
      # Components directory so AudioComponentRegistrar can see it.
      - name: Validate the macOS AUv2 component with auval
        if: startsWith(matrix.os, 'macos')
        run: |
          set -uo pipefail

          component="target/bundled/$PLUGIN.component"
          au_dir="$HOME/Library/Audio/Plug-Ins/Components"
          installed_component="$au_dir/$PLUGIN.component"

          mkdir -p "$au_dir"
          rm -rf "$installed_component"
          cp -R "$component" "$installed_component"

          xattr -dr com.apple.quarantine "$installed_component" 2>/dev/null || true

          killall -9 AudioComponentRegistrar 2>/dev/null || true

          echo "Waiting for AudioComponentRegistrar to rescan..."
          sleep 3

          echo
          echo "Registered BurningTreeC Audio Units:"
          auval -a | grep -E 'BrTC|GainStageFx' || true

          echo
          echo "Running AUv2 validation..."

          set +e
          auval -v aufx GSfx BrTC 2>&1 | tee /tmp/gainstagefx-auval.log
          auval_status=${PIPESTATUS[0]}
          set -e

          echo
          echo "========================================"
          echo "AUVAL ERRORS / IMPORTANT CONTEXT"
          echo "========================================"

          grep -n -B 8 -A 15 \
              -E 'ERROR:|FAILED|VERIFYING CLASS INFO' \
              /tmp/gainstagefx-auval.log || true

          echo
          echo "auval exit status: $auval_status"

          if [ "$auval_status" -ne 0 ]; then
              exit "$auval_status"
          fi

          echo
          echo "AUv2 auval validation passed."

      - name: Test the Linux CLAP editor
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a \
            -s '-screen 0 1920x2160x24 +extension GLX +render' \
            timeout 45s python3 tools/linux_gui_smoke.py "target/bundled/$PLUGIN.clap"

      - name: Stage the archive contents
        run: |
          set -euo pipefail

          staged="staged/$PLUGIN-${{ matrix.name }}"
          mkdir -p "$staged"

          # The standalone binary is a development aid and is not shipped.
          rm -rf "target/bundled/$PLUGIN"

          # The platform-specific bundle command has populated target/bundled.
          # On macOS this now contains CLAP, VST3 and AUv2 (.component).
          cp -R target/bundled/* "$staged/"

          # Ship licensing information with every binary package.
          cp LICENSE THIRD-PARTY-NOTICES.md "$staged/"
          cp ".github/readme-${{ runner.os }}.txt" "$staged/README.txt"

          case '${{ runner.os }}' in
            Linux)
              cp .github/install-Linux.sh "$staged/install.sh"
              chmod +x "$staged/install.sh"
              ;;

            macOS)
              # A macOS package is not complete without all three plugin
              # formats. Fail before uploading an incomplete artifact.
              test -d "$staged/$PLUGIN.clap"
              test -d "$staged/$PLUGIN.vst3"
              test -d "$staged/$PLUGIN.component"

              cp .github/install-macOS.command "$staged/Install.command"
              chmod +x "$staged/Install.command"
              ;;

            Windows)
              # The installer is built separately with the normal release
              # profile, so it remains in target/release/.
              cp target/release/install.exe "$staged/install.exe"
              ;;
          esac

          echo
          echo "Staged package:"
          find "$staged" -maxdepth 3 -print

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN }}-${{ matrix.name }}
          path: staged/${{ env.PLUGIN }}-${{ matrix.name }}
          if-no-files-found: error

  release:
    name: Release

    # Never publish a release unless the tests and every platform package
    # succeeded.
    needs:
      - test
      - package

    # Only v* tags create public GitHub releases. The package job above uses
    # release-lto for exactly these builds.
    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify downloaded release packages
        run: |
          set -euo pipefail

          test -d "artifacts/$PLUGIN-linux"
          test -d "artifacts/$PLUGIN-macos-universal"
          test -d "artifacts/$PLUGIN-windows"

          # The macOS release must contain every supported plugin format.
          test -d "artifacts/$PLUGIN-macos-universal/$PLUGIN.clap"
          test -d "artifacts/$PLUGIN-macos-universal/$PLUGIN.vst3"
          test -d "artifacts/$PLUGIN-macos-universal/$PLUGIN.component"
          test -f "artifacts/$PLUGIN-macos-universal/Install.command"

          echo "All expected release packages are present."

      - name: Zip each platform
        run: |
          set -euo pipefail

          mkdir -p release

          for dir in artifacts/*/; do
            name="$(basename "$dir")"

            # Executability is not preserved through the GitHub Actions
            # artifact round trip.
            chmod +x \
              "$dir/Install.command" \
              "$dir/install.sh" \
              2>/dev/null || true

            (
              cd "$dir"
              zip -qr "../../release/$name-${GITHUB_REF_NAME}.zip" .
            )
          done

          echo
          echo "Release archives:"
          ls -lah release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip \
            --title "$PLUGIN $GITHUB_REF_NAME" \
            --notes-file - <<'NOTES'
          Built from this tag by GitHub Actions.

          Download the archive for your platform and run the installer inside
          it: `install.sh` on Linux, `install.exe` on Windows,
          `Install.command` on macOS. `README.txt` covers installing by hand.
          Every archive also contains `LICENSE` and `THIRD-PARTY-NOTICES.md`.

          **macOS:** the package contains universal Apple Silicon (`arm64`) and
          Intel (`x86_64`) CLAP, VST3 and Audio Unit v2 (`.component`) plugins.
          The plugins are ad-hoc signed but not notarized, so macOS may
          quarantine downloaded archives. `Install.command` puts all plugin
          formats in their user-level Audio Plug-Ins directories and clears the
          quarantine flag. `README.txt` contains the equivalent manual commands.
          NOTES
