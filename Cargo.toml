[package]
name = "gainstagefx"
version = "0.42.0"
edition = "2021"
authors = ["Simon Huber <huber.simon@protonmail.com>"]
license = "MIT OR Apache-2.0"
description = "GainStageFx, circuit modelled gain stages from subtle saturation to high gain (CLAP/VST3/AU)"

[workspace]
members = ["installer", "xtask", "vendor/nice-plug-au2"]
exclude = ["vendor/baseview", "vendor/vizia", "vendor/vizia_plug"]

# One audited backend shared by the editor and its adapter.
[patch.crates-io]
baseview = { path = "vendor/baseview" }

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "gainstagefx"
required-features = ["standalone"]

[features]
# The standalone host is only for trying the plugin outside a DAW.
default = []
standalone = ["nice-plug/standalone"]

[dependencies]
nice-plug = { git = "https://codeberg.org/RustAudio/nice-plug", rev = "e60b5db09d8606c3dc3e93f982847a00bce17325", features = ["unsafe_flush_denormals"] }
vizia_plug = { path = "vendor/vizia_plug" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# AUv2 is a macOS-only plugin format. Keeping this target-specific prevents
# CoreAudio/AppKit dependencies from entering Linux and Windows builds.
[target.'cfg(target_os = "macos")'.dependencies]
nice-plug-au2 = { path = "vendor/nice-plug-au2" }

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 16
strip = "symbols"

# Fast optimized builds for CI correctness testing.
[profile.ci]
inherits = "release"
lto = "off"
opt-level = 2
codegen-units = 16
strip = "none"

# Maximum optimization for exceptional/shipping builds.
[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
