[package]
name = "gainstagefx"
version = "0.24.0"
edition = "2021"
authors = ["Simon Huber <huber.simon@protonmail.com>"]
license = "GPL-3.0-or-later"
description = "GainStageFx, circuit modelled gain stages from subtle saturation to high gain (CLAP/VST3)"

[workspace]
members = ["installer", "xtask"]
exclude = ["vendor/baseview"]

# Preserve the pinned GUI backend, with Windows input and resize fixes vendored.
[patch."https://github.com/RustAudio/baseview.git"]
baseview = { path = "vendor/baseview" }

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "gainstagefx"
required-features = ["standalone"]

[features]
# The standalone host is only for trying the plugin outside a DAW.
default = []
standalone = ["nih_plug/standalone"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23" }
nih_plug_vizia = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "f36931f7af4646065488a9845d8f8c2f95252c23" }
# The same GUI backend vizia uses, which the patch above points at
# `vendor/baseview`. Named directly only for its text-entry switch, which tells
# it on Windows that the preset-name box wants the keyboard.
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "2c1b1a7b0fef1a29a5150a6a8f6fef6a0cbab8c4" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 16
strip = "symbols"

# Fast optimized builds for CI correctness testing.
[profile.ci]
inherits = "release"
lto = "off"
opt-level = 2
codegen-units = 16
strip = "none"

# Maximum optimization for exceptional/shipping builds.
[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
